<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#effbfd" />
    <meta name="description" content="جزوه کامل زیست‌شناسی پایه یازدهم، فصل‌بندی‌شده برای مطالعه دانش‌آموزان" />
    <title>جزوه زیست‌شناسی پایه یازدهم</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b6975'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b7e35b' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23fff'/%3E%3Cpath d='M16 7v5M25 16h-5M16 25v-5M7 16h5' stroke='%23b7e35b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preload" href="Vazirmatn-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>

    <aside class="sidebar" id="sidebar" aria-label="فهرست فصل‌ها">
      <div class="sidebar__top">
        <button class="icon-button sidebar__close" id="closeSidebar" type="button" aria-label="بستن فهرست">×</button>
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div>
          <p class="eyebrow">زیست‌شناسی پایه یازدهم</p>
          <h1>جزوه کامل درس</h1>
        </div>
      </div>

      <div class="course-meta" aria-label="مشخصات جزوه">
        <div><strong>۲۷۱</strong><span>صفحه</span></div>
        <div><strong>۹</strong><span>فصل</span></div>
        <div><strong>۱۴۰۵–۱۴۰۶</strong><span>سال تحصیلی</span></div>
      </div>

      <nav class="chapters" id="chapterList"></nav>

      <a class="pdf-link" href="jozve-zist-11.pdf" download>
        <span>دانلود کل جزوه</span>
        <span aria-hidden="true">↓</span>
      </a>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="reader-shell">
      <header class="reader-header">
        <div class="header-title">
          <button class="icon-button menu-button" id="openSidebar" type="button" aria-label="باز کردن فهرست">☰</button>
          <div>
            <p id="chapterKicker">روی جلد</p>
            <h2 id="chapterTitle">جزوه زیست‌شناسی پایه یازدهم</h2>
          </div>
        </div>

        <div class="view-tools" aria-label="ابزارهای نمایش و تدریس">
          <button class="tool-launch" type="button" id="whiteboardToggle" aria-pressed="false" aria-controls="whiteboardToolbar">
            <span aria-hidden="true">✎</span><span class="tool-launch__label">ابزار تدریس</span>
          </button>
          <button type="button" id="zoomOut" aria-label="کوچک‌نمایی">−</button>
          <button type="button" id="fitPage">اندازه صفحه</button>
          <button type="button" id="zoomIn" aria-label="بزرگ‌نمایی">+</button>
          <button class="tool-launch" type="button" id="fullscreenToggle" aria-label="نمایش تمام‌صفحه" aria-pressed="false">
            <span aria-hidden="true">⛶</span><span class="tool-launch__label">تمام‌صفحه</span>
          </button>
        </div>
      </header>

      <section class="whiteboard-toolbar" id="whiteboardToolbar" aria-label="ابزارهای تخته وایت‌برد" hidden>
        <div class="whiteboard-toolbar__tools" role="toolbar" aria-label="نوع ابزار">
          <button class="drawing-tool" type="button" data-tool="pan" aria-pressed="false"><span aria-hidden="true">☝</span><span>حرکت صفحه</span></button>
          <button class="drawing-tool is-active" type="button" data-tool="pen" aria-pressed="true"><span aria-hidden="true">✎</span><span>قلم</span></button>
          <button class="drawing-tool" type="button" data-tool="line" aria-pressed="false"><span aria-hidden="true">╱</span><span>خط صاف</span></button>
          <button class="drawing-tool" type="button" data-tool="marker" aria-pressed="false"><span aria-hidden="true">▰</span><span>ماژیک</span></button>
          <button class="drawing-tool" type="button" data-tool="highlighter" aria-pressed="false"><span aria-hidden="true">▱</span><span>هایلایتر</span></button>
          <button class="drawing-tool" type="button" data-tool="eraser" aria-pressed="false"><span aria-hidden="true">◇</span><span>پاک‌کن</span></button>
        </div>

        <div class="whiteboard-toolbar__settings">
          <div class="color-swatches" aria-label="رنگ قلم">
            <button class="color-swatch is-active" type="button" data-color="#e52f42" style="--swatch:#e52f42" aria-label="قرمز" aria-pressed="true"></button>
            <button class="color-swatch" type="button" data-color="#0b6975" style="--swatch:#0b6975" aria-label="سبزآبی" aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#2463eb" style="--swatch:#2463eb" aria-label="آبی" aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#f4c430" style="--swatch:#f4c430" aria-label="زرد" aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#202b31" style="--swatch:#202b31" aria-label="مشکی" aria-pressed="false"></button>
          </div>
          <label class="stroke-width" for="strokeWidth"><span>ضخامت</span><input id="strokeWidth" type="range" min="2" max="22" value="5" /></label>
        </div>

        <div class="whiteboard-toolbar__actions">
          <button type="button" id="undoDrawing" aria-label="برگرداندن آخرین خط">↶ <span>برگشت</span></button>
          <button class="clear-drawing" type="button" id="clearDrawing" aria-label="پاک کردن نوشته‌های این صفحه">پاک‌کردن صفحه</button>
          <button type="button" id="closeWhiteboard" aria-label="بستن ابزار تدریس">×</button>
        </div>
      </section>

      <section class="page-stage" id="pageStage" aria-live="polite">
        <figure class="page-sheet" id="pageSheet">
          <div class="page-canvas-wrap" id="pageCanvasWrap">
            <img id="pageImage" src="page-001.webp" alt="صفحه ۱ از جزوه زیست‌شناسی پایه یازدهم" width="1020" height="1501" />
            <canvas id="annotationCanvas" aria-label="صفحه نوشتن و علامت‌گذاری"></canvas>
          </div>
          <figcaption>صفحه <span id="captionPage">۱</span> از ۲۷۱</figcaption>
        </figure>
        <div class="loading" id="loading" hidden>در حال آماده‌سازی صفحه…</div>
      </section>

      <nav class="page-controls" aria-label="پیمایش صفحه‌ها">
        <button class="next-page" id="nextPage" type="button">
          <span>صفحه بعد</span><span aria-hidden="true">←</span>
        </button>

        <label class="page-jump">
          <span>صفحه</span>
          <input id="pageInput" type="number" min="1" max="271" value="1" inputmode="numeric" aria-label="شماره صفحه" />
          <span>از ۲۷۱</span>
        </label>

        <button class="prev-page" id="prevPage" type="button" disabled>
          <span aria-hidden="true">→</span><span>صفحه قبل</span>
        </button>
      </nav>
    </main>

    <script src="app.js"></script>
  </body>
</html>
